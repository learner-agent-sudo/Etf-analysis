name: Deploy to GitHub Pages

# Publishes the static site in public/ to GitHub Pages on every push.
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that, every push here auto-deploys.

on:
  push:
    branches:
      - claude/keen-feynman-NnG7I   # current default branch
      - main                        # in case the site later lives on main
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:                # allow manual "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
