<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ETF Analysis</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▲</span>
      <h1>ETF Analysis</h1>
    </div>
    <div class="theme-picker">
      <label for="themeSelect">Theme</label>
      <select id="themeSelect" aria-label="Select theme"></select>
    </div>
  </header>

  <main id="main">
    <section id="themeIntro" class="intro"></section>

    <section class="controls" id="controls" hidden>
      <input type="search" id="filterBox" placeholder="Filter by ticker or name…" />
      <label class="toggle">
        <input type="checkbox" id="themeOnly" /> Theme funds only (hide benchmarks)
      </label>
      <span class="hint">Click a column header to sort · click a row to open the memo</span>
    </section>

    <section id="tableWrap" class="table-wrap"></section>

    <section id="tensions" class="tensions"></section>
  </main>

  <!-- Memo drawer -->
  <div id="overlay" class="overlay" hidden></div>
  <aside id="memoDrawer" class="drawer" hidden aria-label="ETF memo">
    <button id="closeMemo" class="close" aria-label="Close">×</button>
    <div id="memoBody"></div>
  </aside>

  <footer class="foot">
    <p>
      Personal research aid — <strong>not investment advice</strong>. All figures
      from public sources, may be stale; verify against the issuer fact sheet and
      latest SEC filing before acting. Data shown carries an <em>as-of</em> date.
    </p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
